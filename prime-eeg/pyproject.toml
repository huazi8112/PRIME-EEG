[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prime-eeg"
version = "0.1.0"
description = "Frozen reproduction of patient-referenced, confirmation-gated seizure detection"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.5", "scipy==1.16.3", "pyedflib==0.1.42"]

[project.scripts]
prime-eeg = "prime_eeg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prime_eeg = ["resources/*.json", "resources/cohort/*/manifest.json"]
