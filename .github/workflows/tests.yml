name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  numerical-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: prime-eeg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: prime-eeg/pyproject.toml
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m prime_eeg verify-results
